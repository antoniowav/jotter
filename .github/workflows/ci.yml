name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"   # weekly, so new advisories surface even without new commits
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.25", stable]   # the minimum in go.mod, and the latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - name: go mod tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -o /dev/null .

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # gitleaks scans the whole history
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: govulncheck (known vulnerabilities in Go and dependencies)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: gosec
        run: go run github.com/securego/gosec/v2/cmd/gosec@latest ./...
      - name: shellcheck
        run: shellcheck -s bash -e SC2034,SC2154,SC2164 install uninstall packaging/arch/PKGBUILD
      - name: gitleaks (secrets in the code and its history)
        run: go run github.com/zricethezav/gitleaks/v8@latest git . --redact --no-banner

  package:
    name: Arch package (makepkg + namcap)
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    defaults:
      run:
        shell: bash
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed git namcap && pacman -Fy   # file database: lets namcap map commands to packages
      - uses: actions/checkout@v7
      - name: Install the PKGBUILD's dependencies
        run: |
          source packaging/arch/PKGBUILD
          pacman -S --noconfirm --needed "${depends[@]}" "${makedepends[@]}"
      - name: Build the package from this commit
        run: |
          git config --global --add safe.directory "$PWD"
          source packaging/arch/PKGBUILD
          mkdir -p /tmp/build && cp packaging/arch/PKGBUILD /tmp/build/
          git archive --prefix="$pkgname-$pkgver/" -o "/tmp/build/$pkgname-$pkgver.tar.gz" HEAD
          useradd -m builder && chown -R builder /tmp/build
          cd /tmp/build && sudo -u builder makepkg -f --noconfirm
      - name: namcap
        run: |
          cd /tmp/build
          namcap PKGBUILD ./jotter-[0-9]*.pkg.tar.zst | tee namcap.txt
          ! grep -E ' E: ' namcap.txt
